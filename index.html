<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Islaah Foundation's Aamaal Circle</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(160deg, #062c28 0%, #0a403a 55%, #041f1c 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .welcome-label {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #a7f3d0;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .logo-wrap {
      width: 190px;
      height: 190px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .brand-subtitle {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #bef264;
      font-weight: 600;
      margin-bottom: 36px;
    }
    .status-pill {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(190, 242, 100, 0.35);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      color: #ecfccb;
    }
  </style>
</head>
<body>

  <div class="welcome-label">Welcome To</div>

  <!-- Original Mosque & Tasbih Vector Icon -->
  <div class="logo-wrap">
    <svg viewBox="0 0 220 200" width="190" height="190" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="circleGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#14b8a6"/>
          <stop offset="100%" stop-color="#84cc16"/>
        </linearGradient>
        <linearGradient id="mosqueGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#d9f99d"/>
        </linearGradient>
      </defs>
      <!-- Tasbih Beads Loop on the Right -->
      <circle cx="135" cy="40" r="6" stroke="#bef264" stroke-width="3"/>
      <circle cx="152" cy="44" r="6" stroke="#bef264" stroke-width="3"/>
      <circle cx="166" cy="54" r="6" stroke="#bef264" stroke-width="3"/>
      <circle cx="174" cy="70" r="6" stroke="#bef264" stroke-width="3"/>
      <circle cx="172" cy="88" r="6" stroke="#bef264" stroke-width="3"/>
      <circle cx="163" cy="104" r="6" stroke="#bef264" stroke-width="3"/>
      <circle cx="155" cy="120" r="6" stroke="#bef264" stroke-width="3"/>
      <circle cx="150" cy="138" r="6" stroke="#bef264" stroke-width="3"/>
      <circle cx="138" cy="152" r="6" stroke="#bef264" stroke-width="3"/>
      <circle cx="121" cy="158" r="6" stroke="#bef264" stroke-width="3"/>
      <!-- Tasbih Tassel -->
      <path d="M180 70 C192 75, 195 90, 195 105" stroke="#bef264" stroke-width="3" stroke-linecap="round"/>
      <rect x="189" y="105" width="12" height="16" rx="3" stroke="#bef264" stroke-width="3"/>
      <!-- Main Emblem Circle -->
      <circle cx="90" cy="100" r="68" fill="url(#circleGrad)" stroke="#ecfccb" stroke-width="2" stroke-dasharray="4 4"/>
      <!-- Mosque Silhouette -->
      <rect x="52" y="75" width="12" height="75" rx="2" fill="url(#mosqueGrad)"/>
      <polygon points="58,60 50,75 66,75" fill="url(#mosqueGrad)"/>
      <rect x="116" y="75" width="12" height="75" rx="2" fill="url(#mosqueGrad)"/>
      <polygon points="122,60 114,75 130,75" fill="url(#mosqueGrad)"/>
      <path d="M68 115 C68 88, 112 88, 112 115 Z" fill="url(#mosqueGrad)"/>
      <circle cx="90" cy="84" r="4" fill="#ecfccb"/>
      <rect x="68" y="115" width="44" height="35" fill="url(#mosqueGrad)"/>
      <path d="M82 150 L82 132 C82 124, 98 124, 98 132 L98 150 Z" fill="#062c28"/>
    </svg>
  </div>

  <h1 class="brand-title">ISLAAH FOUNDATION'S</h1>
  <div class="brand-subtitle">Aamaal Circle</div>

  <div class="status-pill">✅ Step 1 Complete: Live on Phone!</div>

</body>
</html>
